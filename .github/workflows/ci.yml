name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      moleditpy_ref:
        description: 'MoleditPy branch, tag, or full commit SHA (blank uses repository default)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  MOLEDITPY_REF: ${{ inputs.moleditpy_ref || vars.MOLEDITPY_REF || 'main' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
      with:
        path: moleditpy_3d-molecule-on-2d

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest rdkit PySide6-Essentials

    - name: Clone main MoleditPy application
      shell: bash
      run: |
        git init "python_molecular_editor"
        git -C "python_molecular_editor" remote add origin https://github.com/HiroYokoyama/python_molecular_editor.git
        git -C "python_molecular_editor" fetch --depth 1 origin "$MOLEDITPY_REF"
        git -C "python_molecular_editor" checkout --detach FETCH_HEAD
        git -C "python_molecular_editor" log -1 --format="%H %s"

    - name: Run test suite
      env:
        MOLEDITPY_HEADLESS: "1"
        QT_QPA_PLATFORM: "offscreen"
        PYTEST_QT_API: "pyside6"
      run: |
        cd moleditpy_3d-molecule-on-2d
        python -m pytest tests/ -v
